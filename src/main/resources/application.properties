spring.application.name=CampusHire

campushire.min-salary-lpa=6.0
campushire.featured-companies=Zoho,Freshworks,Google
campushire.currency=INR
campushire.seed.jobs-file=classpath:seed/jobs.csv
campushire.notifier.sms.enabled = false
logging.pattern.level=%5p [%X{requestId:-}]
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s