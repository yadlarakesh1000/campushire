spring.application.name=CampusHire

# H2 in-memory database for dev (switch to MySQL for production)
spring.datasource.url=jdbc:h2:mem:campushire
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
campushire.min-salary-lpa=6.0
campushire.featured-companies=Zoho,Freshworks,Google
campushire.currency=INR
campushire.seed.jobs-file=classpath:seed/jobs.csv
campushire.notifier.sms.enabled = false